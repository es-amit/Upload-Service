spring:
  application:
    name: Upload-Service


# Database Configuration
  datasource:
    url: jdbc:mysql://localhost:3306/upload_service?createdDatabaseIfNotExist=true
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true


# Object Storage Configuration
minio:
  endpoint: http://localhost:9000
  access-key: admin
  secret-key: password
  bucket: videos
  chunk-size: 10485760 # 10 MB


server:
  port: 8080
